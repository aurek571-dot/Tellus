name: Build Minecraft 26.1.2 (mc261)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mc261 jar
        run: ./gradlew -PtellusTargets=mc261 build -x test --console=plain
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Tellus-fabric-26.1.2
          path: mc261/build/libs/*.jar
