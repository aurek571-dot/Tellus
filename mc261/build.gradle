plugins {
	id 'net.fabricmc.fabric-loom' version '1.16.1'
	id 'maven-publish'
}

// EXPERIMENTAL / UNCOMPILED scaffold: Minecraft 26.1.2 backport target.
// Inherits the 26.2 sources; any 26.1.2 vs 26.2 API differences that surface as
// compile errors should be fixed by adding adapters under shared/mc261 and listing
// them in overriddenSharedMainSources / overriddenSharedClientSources below.
ext.tellus = [
	minecraftVersion: '26.1.2',
	loaderVersion: '0.19.3',
	fabricVersion: '0.146.1+26.1.2',
	fabricDependencyConfiguration: 'implementation',
	javaVersion: 25,
	distantHorizonsRuntimeProperty: 'mc261_distant_horizons_runtime_path',
	sharedSourceLayers: ['post-1201', 'mc262', 'mc26', 'mc261', 'fabric'],
	overriddenSharedMainSources: ['com/yucareux/tellus/compat/Minecraft26Compat.java'],
	inheritedJavaProjects: ['mc262'],
	overriddenInheritedMainResources: ['fabric.mod.json'],
	mapboxVersion: '24.1.1',
	protobufVersion: '4.28.2',
	officialMappings: false,
]

apply from: rootProject.file('gradle/tellus-fabric.gradle')
